[project]
name = "nuclio-api-migration"
version = "1.0.0"
description = "Migrating a FastAPI service to Nuclio serverless functions with Kafka and Kong, verified by contract-parity tests"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/cases.py" = ["E501"]  # one request per line reads better as a table
