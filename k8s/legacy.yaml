# The Quote API (FastAPI) running as 2 replicas behind a ClusterIP Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quote-legacy
  labels: {app: quote-legacy}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: quote-legacy}
  template:
    metadata:
      labels: {app: quote-legacy}
    spec:
      containers:
        - name: api
          image: quote-legacy:ci
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          env:
            - {name: REDIS_URL, value: "redis://redis:6379/0"}
          # /healthz pings Redis, so a pod only receives traffic while its dependency is reachable.
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: quote-legacy
spec:
  selector: {app: quote-legacy}
  ports: [{port: 8000, targetPort: 8000}]
