name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NUCLIO_VERSION: "1.17.9"

jobs:
  test:
    name: unit + in-process parity (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -p no:warnings

  integration:
    name: live stack (Kafka + Nuclio + Kong)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: Install nuctl
        run: |
          curl -fsSL -o /usr/local/bin/nuctl \
            "https://github.com/nuclio/nuclio/releases/download/${NUCLIO_VERSION}/nuctl-${NUCLIO_VERSION}-linux-amd64"
          chmod +x /usr/local/bin/nuctl
          nuctl version

      - name: Deploy stack
        run: bash scripts/deploy.sh

      - name: Live parity through Kong
        run: python -m parity.run_live

      - name: Cutover and rollback via Kong weights
        run: |
          check_all() {
            for i in $(seq 1 20); do
              curl -sS -o /dev/null -D - -H 'apikey: demo-key-change-me' http://localhost:8080/v1/quotes/none \
                | grep -i '^x-backend' | tr -d '\r' || true
            done | sort | uniq -c | tee /tmp/split
            test -s /tmp/split && ! grep -qiv "x-backend: $1" /tmp/split
          }
          bash scripts/set_canary.sh 0 100 && sleep 1 && check_all nuclio
          bash scripts/set_canary.sh 100 0 && sleep 1 && check_all legacy

      - name: Load test
        run: python -m perf.load --requests 400 --concurrency 20

      - name: Dump logs
        if: failure()
        run: |
          docker ps -a
          docker compose --profile gateway logs --tail 200
          for c in $(docker ps -a --format '{{.Names}}' | grep '^nuclio-'); do echo "== $c"; docker logs --tail 200 "$c"; done

  kubernetes:
    name: kubernetes (kind) + Argo CD + Argo Workflows
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ARGOCD_VERSION: v2.13.3
      ARGO_WF_VERSION: v3.6.2
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1.12.0

      - name: Build image and load it into the cluster
        run: |
          docker build -f legacy/Dockerfile -t quote-legacy:ci .
          kind load docker-image quote-legacy:ci --name chart-testing

      - name: Validate manifests (client-side dry run)
        run: kubectl kustomize k8s | kubectl apply --dry-run=client -f -

      - name: Install Argo CD
        run: |
          kubectl create namespace argocd
          kubectl apply -n argocd --server-side \
            -f "https://raw.githubusercontent.com/argoproj/argo-cd/${ARGOCD_VERSION}/manifests/install.yaml"
          kubectl -n argocd rollout status deploy/argocd-repo-server --timeout=240s
          kubectl -n argocd rollout status deploy/argocd-server --timeout=240s
          kubectl -n argocd rollout status deploy/argocd-applicationset-controller --timeout=240s
          kubectl -n argocd rollout status statefulset/argocd-application-controller --timeout=240s

      - name: GitOps deploy through Argo CD (pinned to this commit)
        run: |
          sed "s|targetRevision: HEAD|targetRevision: ${GITHUB_SHA}|" argo/application.yaml | kubectl apply -f -
          for i in $(seq 1 60); do
            sync=$(kubectl -n argocd get application quote-api -o jsonpath='{.status.sync.status}' 2>/dev/null || true)
            health=$(kubectl -n argocd get application quote-api -o jsonpath='{.status.health.status}' 2>/dev/null || true)
            echo "sync=$sync health=$health"
            [ "$sync" = "Synced" ] && [ "$health" = "Healthy" ] && break
            sleep 5
          done
          test "$sync" = "Synced" && test "$health" = "Healthy"
          kubectl -n quotes get deploy,svc,pdb,pods

      - name: Install Argo Workflows
        run: |
          kubectl create namespace argo
          kubectl apply -n argo \
            -f "https://github.com/argoproj/argo-workflows/releases/download/${ARGO_WF_VERSION}/install.yaml"
          kubectl -n argo rollout status deploy/workflow-controller --timeout=240s
          kubectl apply -f argo/workflow-rbac.yaml

      - name: Run verification workflow
        run: |
          name=$(kubectl create -f argo/smoke-workflow.yaml -o jsonpath='{.metadata.name}')
          echo "workflow: $name"
          for i in $(seq 1 60); do
            phase=$(kubectl -n argo get workflow "$name" -o jsonpath='{.status.phase}' 2>/dev/null || true)
            echo "phase=$phase"
            case "$phase" in Succeeded|Failed|Error) break;; esac
            sleep 5
          done
          for p in $(kubectl -n argo get pods -l workflows.argoproj.io/workflow="$name" -o name); do
            echo "== $p"; kubectl -n argo logs "$p" -c main || true
          done
          test "$phase" = "Succeeded"

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl -n argocd get application quote-api -o yaml || true
          kubectl -n quotes describe pods || true
          kubectl -n argo get workflows -o yaml || true

  go-probe:
    name: go probe (vet + race tests)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: probe/go.mod
      - run: test -z "$(gofmt -l probe)"
      - run: go vet ./...
        working-directory: probe
      - run: go test -race -count=1 ./...
        working-directory: probe

  jenkins-lint:
    name: Jenkinsfile (Jenkins declarative linter)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start Jenkins with pipeline plugins
        run: |
          docker build -f ci/jenkins-lint.Dockerfile -t jenkins-lint ci
          docker run -d --name jenkins -p 8080:8080 \
            -e JAVA_OPTS="-Djenkins.install.runSetupWizard=false" jenkins-lint
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/login || true)
            echo "jenkins login: $code"
            [ "$code" = "200" ] && break
            sleep 5
          done
          test "$code" = "200"
      - name: Validate Jenkinsfile
        run: |
          out=$(curl -s -X POST -F "jenkinsfile=<Jenkinsfile" http://localhost:8080/pipeline-model-converter/validate)
          echo "$out"
          echo "$out" | grep -q "successfully validated"
      - name: Jenkins logs on failure
        if: failure()
        run: docker logs --tail 100 jenkins
