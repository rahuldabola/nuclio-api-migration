# Argo CD Application: keeps the cluster in sync with k8s/ in this repo (GitOps).
# targetRevision is HEAD here; CI pins it to the commit under test.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quote-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rahuldabola/nuclio-api-migration.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: quotes
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
